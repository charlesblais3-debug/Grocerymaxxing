name: Update flyers and recipes

# Flyers refresh every morning (Québec flyers roll over on Thursdays, but some banners
# publish early or post mid-week specials). Recipes and StatCan prices refresh weekly.
on:
  schedule:
    - cron: '17 10 * * *'   # daily, ~5-6 am Montréal: flyers
    - cron: '43 7 * * 1'    # Mondays: recipes + baseline prices
  push:
    paths: ['.github/gather.env']   # editing this file requests a full gather run
  workflow_dispatch:
    inputs:
      recipes:
        description: Also gather recipes and baseline prices
        type: boolean
        default: true
      sources:
        description: Comma-separated recipe source ids (empty = all)
        type: string
        default: ''
      scale:
        description: Multiplier on each source's recipe target
        type: string
        default: '1'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read gather request
        if: github.event_name == 'push'
        run: grep -E '^(SOURCES|TARGET_SCALE|MAX_ITEM_LOOKUPS)=[A-Za-z0-9.,_-]*$' .github/gather.env >> "$GITHUB_ENV"
      - name: Start run report
        run: mkdir -p data && echo "# Last data run — $(date -u +'%F %H:%M UTC') (${{ github.event_name }})" > data/last-run.md
      - name: Flyers
        run: node scripts/fetch-flyers.mjs
        continue-on-error: true
      - name: Baseline prices (Statistics Canada)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.recipes || github.event.schedule == '43 7 * * 1'
        run: node scripts/fetch-baseline.mjs
        continue-on-error: true
      - name: Everyday prices (Walmart online catalogue)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.recipes || github.event.schedule == '43 7 * * 1'
        run: node scripts/fetch-shelf.mjs
        continue-on-error: true
      - name: Recipes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.recipes || github.event.schedule == '43 7 * * 1'
        run: node scripts/fetch-recipes.mjs
        env:
          SOURCES: ${{ inputs.sources || env.SOURCES }}
          TARGET_SCALE: ${{ inputs.scale || env.TARGET_SCALE || '1' }}
      - name: Price history
        run: node scripts/history.mjs
        continue-on-error: true
      - name: Index check
        run: node scripts/build-index.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: refresh flyers/recipes $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
